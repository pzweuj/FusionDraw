  <path d="M36 14C30.5 14 29.5 19.5 24 24S17.5 34 12 34" fill="none" stroke="#b794f4" stroke-linecap="round" stroke-width="4.5" />

  <circle cx="12" cy="14" r="2.4" fill="#63d8ff" />
  <circle cx="36" cy="14" r="2.4" fill="#b794f4" />
  <circle cx="12" cy="34" r="2.4" fill="#b794f4" />
  <circle cx="36" cy="34" r="2.4" fill="#63d8ff" />
  <circle cx="24" cy="24" r="4.1" fill="#fff" />
  <path d="M21.9 24h4.2" fill="none" stroke="#172033" stroke-linecap="round" stroke-width="1.8" />
