<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">FusionDraw logo</title>
  <desc id="desc">Two colored genomic tracks merge at a central node.</desc>
  <defs>
