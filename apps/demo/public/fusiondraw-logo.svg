    </filter>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="14" fill="url(#background)" />
  <rect x="1" y="1" width="46" height="46" rx="14" fill="none" stroke="#fff" stroke-opacity=".16" />

  <path d="M12 14C17.5 14 18.5 19.5 24 24S30.5 34 36 34" fill="none" stroke="#63d8ff" stroke-linecap="round" stroke-width="7" opacity=".22" filter="url(#glow)" />
  <path d="M36 14C30.5 14 29.5 19.5 24 24S17.5 34 12 34" fill="none" stroke="#b794f4" stroke-linecap="round" stroke-width="7" opacity=".22" filter="url(#glow)" />
